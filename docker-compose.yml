services:
  supervisor:
    build: .
    image: supervisor:latest
    container_name: supervisor
    hostname: supervisor
    restart: always

    # ---- Resource limits: 4 CPU / 6 GB ----
    cpus: 4
    mem_limit: 6g
    mem_reservation: 2g
    memswap_limit: 6g          # = mem_limit -> không dùng swap
    pids_limit: 4096

    # ---- Yêu cầu để systemd chạy được làm PID 1 ----
    # Đã test: KHÔNG cần privileged. Thiếu bất kỳ dòng nào dưới -> container exit 255.
    cap_add:
      - SYS_ADMIN            # systemd cần để mount / quản cgroup
    security_opt:
      - apparmor=unconfined  # host bật AppArmor -> profile docker-default chặn systemd
    cgroup: host             # cgroupns=private KHÔNG hoạt động (exit 255)
    tmpfs:
      - /run
      - /run/lock
      # /tmp CẦN exec: Docker mặc định tmpfs là noexec,size=64m. opencode (Bun)
      # giải nén native lib ra /tmp rồi dlopen() -> noexec làm nó fail với
      # "failed to map segment from shared object". 64m cũng không đủ chỗ.
      - /tmp:exec,mode=1777,size=2g
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./app:/app
      - ./units:/etc/systemd/system/custom:ro
      # Mount cả THƯ MỤC (không mount file lẻ): clone mới chưa có secrets/token thì
      # Docker sẽ tạo một DIRECTORY tên "token" -> cloudflared lỗi rất khó hiểu.
      # KHÔNG :ro -> `cloudflared service install <TOKEN>` trong container ghi được
      # token, và token đó rơi ra ./secrets/token trên host nên sống qua rebuild.
      - ./secrets:/etc/cloudflared
      # Config + mật khẩu code-server. Nằm trong secrets/ (gitignored) nên sống
      # qua rebuild; không mount thì mỗi lần build lại là một mật khẩu mới.
      - ./secrets/code-server:/root/.config/code-server

    # systemd LÀ init -> không dùng docker-init, và shutdown bằng SIGRTMIN+3
    init: false
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s

    networks:
      appnet:
        ipv4_address: 172.28.0.10

    ports:
      - "2222:22"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  appnet:
    name: appnet
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
          # Dynamic pool = .128-.254 -> static IP ở .2-.127 không bao giờ bị cấp trùng
          ip_range: 172.28.0.128/25
